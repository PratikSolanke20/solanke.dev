<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - AyurSkin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #020617;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .container { max-width: 320px; }
        .icon { font-size: 72px; margin-bottom: 24px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
        .btn {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        .brand { margin-top: 48px; color: #475569; font-size: 12px; }
        .brand span { color: #34d399; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🌿</div>
        <h1>You're Offline</h1>
        <p>AyurSkin needs an internet connection to analyze your skin. Please check your connection and try again.</p>
        <button class="btn" onclick="window.location.reload()">Try Again</button>
        <p class="brand"><span>AyurSkin</span> Pro · Ayurvedic Intelligence</p>
    </div>
</body>
</html>
